<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GASSO - Linjenavigasjon</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #00cfe8;
      padding: 20px;
    }
    header img {
      height: 180px;
    }
    .battery {
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      transition: color 0.4s;
    }
    .battery.green { color: #28a745; }
    .battery.orange { color: #ffc107; }
    .battery.red { color: #dc3545; }

    .sensor-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px auto;
      flex-wrap: wrap;
    }
    .sensor-box {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      width: 150px;
      transition: background-color 0.3s;
    }
    .sensor-box.active {
      background-color: #008cff;
      color: white;
    }
    .sensor-title {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .value {
      font-size: 1.5em;
    }
    .sensor-visual {
      width: 100px;
      height: 100px;
      margin-top: 10px;
      border: 1px solid #999;
      border-radius: 6px;
      background-color: #eee;
      margin-left: auto;
      margin-right: auto;
    }
    .range-box, .control-box {
      margin-top: 30px;
      font-size: 1.1em;
    }
    .range-box input {
      padding: 5px;
      font-size: 1em;
      width: 80px;
      text-align: center;
      margin: 0 10px;
    }
    .btn-back, .btn-start, .btn-stop {
      margin: 20px 10px;
      padding: 12px 25px;
      font-size: 1.1rem;
      background-color: #003366;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-back:hover, .btn-start:hover, .btn-stop:hover {
      background-color: #005f99;
    }
    .status-box {
      margin-top: 30px;
      padding: 15px;
      font-size: 1.3em;
      border-radius: 10px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
      font-weight: bold;
    }
    .status-green { background-color: #28a745; color: white; }
    .status-yellow { background-color: #ffc107; color: black; }
    .status-red { background-color: #dc3545; color: white; }
  </style>
</head>
<body>
<header>
  <img src="/static/gasso_logo.png" alt="GASSO Logo">
  <div id="batteryStatus" class="battery">Batteristatus: <span id="batteryLevel">Laster...</span></div>
</header>

<h2>Linjenavigasjon - Sensorvisning</h2>

<div class="sensor-container">
  <div class="sensor-box" id="D1">
    <div class="sensor-title">Sensor D1</div>
    <div class="value" id="val-D1">...</div>
    <div class="sensor-visual" id="irD1Color"></div>
  </div>
  <div class="sensor-box" id="D3">
    <div class="sensor-title">Sensor D3</div>
    <div class="value" id="val-D3">...</div>
    <div class="sensor-visual" id="irD3Color"></div>
  </div>
  <div class="sensor-box" id="D4">
    <div class="sensor-title">Sensor D4</div>
    <div class="value" id="val-D4">...</div>
    <div class="sensor-visual" id="irD4Color"></div>
  </div>
  <div class="sensor-box" id="D6">
    <div class="sensor-title">Sensor D6</div>
    <div class="value" id="val-D6">...</div>
    <div class="sensor-visual" id="irD6Color"></div>
  </div>
</div>

<div class="range-box">
  <label for="minValue">Linje Min:</label>
  <input type="number" id="minValue">
  <label for="maxValue">Linje Max:</label>
  <input type="number" id="maxValue">
</div>

<div class="control-box">
  <button class="btn-start" onclick="startNavigation()">Start linjenavigasjon</button>
  <button class="btn-stop" onclick="stopNavigation()">Stopp linjenavigasjon</button>
</div>

<div class="status-box status-yellow" id="statusBox">Søker etter linje...</div>

<button class="btn-back" onclick="location.href='/'">Tilbake til hovedmeny</button>
<button class="btn-back" onclick="location.href='/settings'">Sensorinnstillinger</button>

<script>
  function irToGray(val) {
    val = Math.min(1023, Math.max(0, val));
    const gray = 255 - Math.floor((val / 1023) * 255);
    return `rgb(${gray}, ${gray}, ${gray})`;
  }

  async function loadIRSettings() {
    try {
      const res = await fetch('/settings_data');
      const data = await res.json();
      document.getElementById("minValue").value = data.ir_min;
      document.getElementById("maxValue").value = data.ir_max;
    } catch (e) {
      console.error("Feil ved henting av IR-innstillinger:", e);
    }
  }

  async function fetchIRData() {
    const min = parseInt(document.getElementById('minValue').value);
    const max = parseInt(document.getElementById('maxValue').value);

    try {
      const response = await fetch('/ir_data');
      const data = await response.json();
      ['D1','D3','D4','D6'].forEach(sensor => {
        const val = data[sensor];
        document.getElementById(`val-${sensor}`).textContent = val;
        const box = document.getElementById(sensor);
        const visual = document.getElementById(`ir${sensor}Color`);
        visual.style.backgroundColor = irToGray(val);
        if (val >= min && val <= max) {
          box.classList.add('active');
        } else {
          box.classList.remove('active');
        }
      });
    } catch (e) {
      console.error("Feil ved henting av IR-data:", e);
    }
  }

  async function fetchStatus() {
    try {
      const res = await fetch('/linje_status');
      const data = await res.json();
      const box = document.getElementById("statusBox");
      const status = data.status;
      box.textContent = status;

      box.classList.remove("status-red", "status-yellow", "status-green");
      if (status === "Ingen linje detektert") box.classList.add("status-red");
      else if (status === "Søker etter linje") box.classList.add("status-yellow");
      else box.classList.add("status-green");

    } catch (e) {
      console.error("Feil ved henting av status:", e);
    }
  }

  async function fetchBattery() {
    try {
      const response = await fetch('/battery');
      const data = await response.json();
      const level = data.level;
      const voltage = data.voltage.toFixed(2);
      const batteryText = `${level}% – ${voltage} V`;
      const batteryDiv = document.getElementById('batteryStatus');
      document.getElementById('batteryLevel').innerText = batteryText;

      batteryDiv.classList.remove('green', 'orange', 'red');
      if (level >= 75) batteryDiv.classList.add('green');
      else if (level >= 40) batteryDiv.classList.add('orange');
      else batteryDiv.classList.add('red');

    } catch {
      document.getElementById('batteryLevel').innerText = 'Ukjent';
    }
  }

  function startNavigation() {
    fetch('/start_linjenavigasjon');
  }

  function stopNavigation() {
    fetch('/stop_linjenavigasjon');
  }

  setInterval(fetchIRData, 200);
  setInterval(fetchStatus, 1000);
  setInterval(fetchBattery, 10000);

  loadIRSettings();
  fetchIRData();
  fetchStatus();
  fetchBattery();
</script>
</body>
</html>
