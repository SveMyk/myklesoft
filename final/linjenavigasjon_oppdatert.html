<script>
  function irToGray(val) {
    val = Math.min(1023, Math.max(0, val));
    const gray = 255 - Math.floor((val / 1023) * 255);
    return `rgb(${gray}, ${gray}, ${gray})`;
  }

  async function loadIRSettings() {
    try {
      const res = await fetch('/settings_data');
      const data = await res.json();
      document.getElementById("minValue").value = data.ir_min;
      document.getElementById("maxValue").value = data.ir_max;
    } catch (e) {
      console.error("Feil ved henting av IR-innstillinger:", e);
    }
  }

  async function fetchIRData() {
    const min = parseInt(document.getElementById('minValue').value);
    const max = parseInt(document.getElementById('maxValue').value);

    try {
      const response = await fetch('/ir_data');
      const data = await response.json();
      ['D1','D3','D4','D6'].forEach(sensor => {
        const val = data[sensor];
        document.getElementById(`val-${sensor}`).textContent = val;
        const box = document.getElementById(sensor);
        const visual = document.getElementById(`ir${sensor}Color`);
        visual.style.backgroundColor = irToGray(val);
        if (val >= min && val <= max) {
          box.classList.add('active');
        } else {
          box.classList.remove('active');
        }
      });
    } catch (e) {
      console.error("Feil ved henting av IR-data:", e);
    }
  }

  async function fetchStatus() {
    try {
      const res = await fetch('/linje_status');
      const data = await res.json();
      const box = document.getElementById("statusBox");
      const status = data.status;
      box.textContent = status;

      box.classList.remove("status-red", "status-yellow", "status-green");
      if (status === "Ingen linje detektert") box.classList.add("status-red");
      else if (status === "Søker etter linje") box.classList.add("status-yellow");
      else box.classList.add("status-green");

    } catch (e) {
      console.error("Feil ved henting av status:", e);
    }
  }

  async function fetchBattery() {
    try {
      const response = await fetch('/battery');
      const data = await response.json();
      const level = data.level;
      const voltage = data.voltage.toFixed(2);
      const batteryText = `${level}% – ${voltage} V`;
      const batteryDiv = document.getElementById('batteryStatus');
      document.getElementById('batteryLevel').innerText = batteryText;

      batteryDiv.classList.remove('green', 'orange', 'red');
      if (level >= 75) batteryDiv.classList.add('green');
      else if (level >= 40) batteryDiv.classList.add('orange');
      else batteryDiv.classList.add('red');

    } catch {
      document.getElementById('batteryLevel').innerText = 'Ukjent';
    }
  }

  function startNavigation() {
    fetch('/start_linjenavigasjon');
  }

  function stopNavigation() {
    fetch('/stop_linjenavigasjon');
  }

  setInterval(fetchIRData, 200);
  setInterval(fetchStatus, 1000);
  setInterval(fetchBattery, 10000);

  loadIRSettings();  // Henter inn ir_min og ir_max ved oppstart
  fetchIRData();
  fetchStatus();
  fetchBattery();
</script>
