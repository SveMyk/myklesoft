<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GASSO - Manuell Kontroll (Dynamiske knapper)</title>
  <style>
    :root {
      --button-size: 80px;
      --symbol-size: 64px;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #00cfe8;
      padding: 20px;
    }

    header img {
      height: 160px;
    }

    .battery {
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: color 0.4s;
    }

    .battery.green { color: #28a745; }
    .battery.orange { color: #ffc107; }
    .battery.red { color: #dc3545; }

    .grid-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 800px;
      margin: 20px auto;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, auto);
      grid-template-rows: repeat(3, auto);
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    button.control-btn {
      width: var(--button-size);
      height: var(--button-size);
      font-size: var(--symbol-size);
      border-radius: 10px;
      border: none;
      background-color: #003366;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button.control-btn:hover {
      background-color: #005f99;
    }

    .rotate-btn {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: calc(var(--symbol-size) - 10px);
      width: calc(var(--button-size) - 10px);
      height: calc(var(--button-size) * 3);
      border-radius: 15px;
      background-color: #003366;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rotate-btn:hover {
      background-color: #005f99;
    }

    .stop-btn {
      background-color: #cc0000 !important;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.2rem;
      color: #003366;
    }

    .btn-back {
      min-width: 140px;
      height: auto;
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #003366;
      color: #fff;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin: 10px auto;
      display: block;
    }

    .btn-back:hover {
      background-color: #005f99;
    }

    .sensor-data {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .sensor-bar {
      width: 30px;
      height: 120px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bar {
      width: 100%;
      border-radius: 6px;
    }

    .sensor-block {
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/gasso_logo.png" alt="GASSO Logo">
    <div id="batteryStatus" class="battery">Batteristatus: <span id="batteryLevel">Laster...</span></div>
  </header>

  <div class="grid-container">
    <button class="rotate-btn" onmousedown="sendCommand(0,0,-1)" onmouseup
