<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>GASSO – LIDAR Visning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: #f4f4f4;
      text-align: center;
    }
    header {
      background-color: #00cfe8;
      padding: 20px;
    }
    header img {
      height: 160px;
    }
    .battery {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #003366;
    }
    h1 {
      color: #003366;
      margin-top: 20px;
    }
    svg {
      margin-top: 20px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .btn {
      margin: 20px 10px;
      padding: 12px 24px;
      font-size: 1.1rem;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #005f99;
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/gasso_logo.png" alt="GASSO Logo" />
    <div class="battery">Batteristatus: <span id="batteryLevel">--%</span></div>
  </header>

  <h1>LIDAR Visning</h1>

  <svg id="lidarCanvas" viewBox="-250 -250 500 500" width="500" height="500">
    <!-- Sirkler for referanse -->
    <circle cx="0" cy="0" r="50" stroke="#ccc" fill="none"/>
    <circle cx="0" cy="0" r="100" stroke="#ccc" fill="none"/>
    <circle cx="0" cy="0" r="150" stroke="#ccc" fill="none"/>
    <circle cx="0" cy="0" r="200" stroke="#ccc" fill="none"/>
  </svg>

  <div>
    <button class="btn" onclick="location.href='/'">Tilbake til hovedmeny</button>
  </div>

  <script>
    function polarToXY(angleDeg, dist) {
      const angleRad = (angleDeg - 90) * (Math.PI / 180);
      const x = dist * Math.cos(angleRad);
      const y = dist * Math.sin(angleRad);
      return { x, y };
    }

    function updateLidar() {
      fetch("/lidar_data")
        .then(res => res.json())
        .then(data => {
          const canvas = document.getElementById("lidarCanvas");
          // Fjern tidligere punkter
          canvas.querySelectorAll(".dot").forEach(e => e.remove());

          const historikk = data.scan;
          const antallRunder = historikk.length;

          for (let runde = antallRunder - 1; runde >= 0; runde--) {
            const farge = `rgba(0, 0, 255, ${1 - runde * 0.2})`;  // blå med fading
            const sektorer = historikk[runde];

            for (let i = 0; i < sektorer.length; i++) {
              const dist = sektorer[i];
              if (dist) {
                const vinkel = i * 5;
                const pos = polarToXY(vinkel, dist * 0.5); // skaler avstand
                const sirkel = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                sirkel.setAttribute("cx", pos.x.toFixed(1));
                sirkel.setAttribute("cy", pos.y.toFixed(1));
                sirkel.setAttribute("r", 3);
                sirkel.setAttribute("fill", farge);
                sirkel.classList.add("dot");
                canvas.appendChild(sirkel);
              }
            }
          }
        });
    }

    function fetchBattery() {
      fetch("/battery")
        .then(res => res.json())
        .then(data => {
          document.getElementById("batteryLevel").innerText = data.level + "%";
        });
    }

    fetchBattery();
    updateLidar();
    setInterval(fetchBattery, 30000);
    setInterval(updateLidar, 1000);
  </script>
</body>
</html>
